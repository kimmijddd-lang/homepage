  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AccountingService",
      "@id": "{{siteUrl}}/#accountingservice",
      "name": "{{name}}",
      "alternateName": "{{name}} 세무사",
      "url": "{{siteUrl}}/",
      "description": "{{home_description}}",
      "image": "{{siteUrl}}/assets/images/og-kim-minjun.jpg",
      "logo": "{{siteUrl}}/assets/images/apple-touch-icon.png",
      "telephone": "{{phone_e164}}",
      "email": "{{email}}",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "{{address_street}}",
        "postalCode": "{{address_postal}}",
        "addressLocality": "{{address_city}}",
        "addressRegion": "{{address_region}}",
        "addressCountry": "KR"
      },
      "openingHours": "{{opening_hours}}",
      "hasMap": "{{map_naver}}",
      "areaServed": "KR",
      "founder": {
        "@type": "Person",
        "@id": "{{siteUrl}}/authors/kim-minjun#person",
        "name": "{{representative}}",
        "jobTitle": "세무사",
        "url": "{{siteUrl}}/authors/kim-minjun"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "{{phone_e164}}",
        "contactType": "customer service",
        "availableLanguage": ["ko"]
      },
      "sameAs": [
        "{{instagram}}",
        "{{blog}}",
        "{{map_naver}}",
        "{{map_kakao}}"
      ]
    }
  </script>
